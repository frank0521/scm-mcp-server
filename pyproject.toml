[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for Palo Alto Networks Strata Cloud Manager"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Frank Fan", email = "frank.fan@example.com"}
]
keywords = ["mcp", "palo-alto", "scm", "strata-cloud-manager"]

dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0",
    "black>=23.0",
]

[project.scripts]
scm-mcp-check = "scm_mcp_server.check:main"
scm-mcp-server = "scm_mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
